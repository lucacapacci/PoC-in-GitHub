name: Repo Sync
on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

jobs:
  sync-code:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync and Clean
        run: |
          # 1. Setup identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 2. Clone source into temporary location
          git clone --depth 1 https://github.com/nomi-sec/PoC-in-GitHub.git /tmp/source_repo

          # 3. Backup your sync workflow
          cp .github/workflows/sync.yml /tmp/sync.yml_backup

          # 4. Wipe working directory (leaves .git untouched)
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' -exec rm -rf {} +

          # 5. Copy upstream files while explicitly EXCLUDING their .git directory
          rsync -av --exclude='.git' /tmp/source_repo/ .

          # 6. Clean upstream workflows/README & restore your sync workflow
          rm -rf .github/workflows
          rm -rf README.md
          mkdir -p .github/workflows
          cp /tmp/sync.yml_backup .github/workflows/sync.yml

          # 7. Commit and push standard file updates
          git add -A
          git commit -m "Sync: $(date)" || echo "No changes to sync"
          git push origin main
